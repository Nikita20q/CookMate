spring:
  application:
    name: cookmate-backend-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # 🚨 КРИТИЧЕСКИ ВАЖНО ДЛЯ TC-R07 (Защита от Mass Assignment)
  jackson:
    deserialization:
      fail-on-unknown-properties: true

app:
  server-url: http://localhost:8080
  gateway-url: http://localhost:8090
  cors-allowed-origins: http://localhost,http://localhost:3000

jwt:
  secret: test-secret-key-for-testing-purposes-only-must-be-long-enough
  expiration: 86400000

ml:
  service:
    url: http://localhost:8000

logging:
  level:
    root: WARN
    smartfridge: WARN