server:
  port: 8080

spring:
  application:
    name: cookmate-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cookmate}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: smtp.yandex.ru
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: smtp.yandex.ru
          connectiontimeout: 30000
          timeout: 30000
          writetimeout: 30000

  jackson:
    deserialization:
      fail-on-unknown-properties: true

app:
  server-url: ${SERVER_URL:http://localhost:8080}
  gateway-url: ${GATEWAY_URL:http://localhost:8090}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    url: ${app.server-url}/v3/api-docs
    config-url: ${app.server-url}/v3/api-docs/swagger-config
    urls:
      - name: Backend API
        url: ${app.server-url}/v3/api-docs

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000